<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <title>PoProstu Siłka</title>
    <base href="/" />
    <!--
      viewport-fit=cover is what makes env(safe-area-inset-*) resolve to a real value on a notched
      iOS device; without it the bottom bar's safe-area padding computes to 0px and the bar sits
      under the home indicator. It is a GLOBAL change - it lets content extend into the inset areas
      on every screen, not only the ones with the bar.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!--
      The manifest is not decoration: iOS 16.4+ delivers Web Push ONLY to a PWA installed to the
      home screen, and installing requires a valid manifest with icons. Without this, push silently
      never subscribes on any iPhone — no error, it simply never happens.
    -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#1f2937" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
