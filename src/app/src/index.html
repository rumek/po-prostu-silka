<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <title>Po Prostu Siłka</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!--
      The manifest is not decoration: iOS 16.4+ delivers Web Push ONLY to a PWA installed to the
      home screen, and installing requires a valid manifest with icons. Without this, push silently
      never subscribes on any iPhone — no error, it simply never happens.
    -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#1f2937" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
