<!-- One 24x24 stroke grid for every icon, so they sit at the same optical weight beside each other.
     aria-hidden throughout: naming is the containing control's job — see the component docblock. -->
<svg
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="1.75"
  stroke-linecap="round"
  stroke-linejoin="round"
  aria-hidden="true"
  focusable="false"
>
  @switch (name()) {
    @case ('home') {
      <path d="M3 11 12 3l9 8" />
      <path d="M5.5 9.5V20h13V9.5" />
    }
    @case ('calendar') {
      <rect x="3" y="5" width="18" height="16" rx="2" />
      <path d="M8 3v4M16 3v4M3 11h18" />
    }
    <!-- A booking is a class you are confirmed for, so: a tick, not another grid. Deliberately the
         least calendar-like shape in the set, because "Grafik" sits next to it. -->
    @case ('booking') {
      <circle cx="12" cy="12" r="9" />
      <path d="M8 12.5l2.5 2.5L16 9.5" />
    }
    <!-- A dumbbell rather than a list: "Mój plan" is the other list-shaped tab, and two list icons in
         one bar is exactly how an icon-only bar stops being readable. -->
    @case ('plan') {
      <path d="M6.5 6.5v11M3.5 9.5v5M17.5 6.5v11M20.5 9.5v5M6.5 12h11" />
    }
    <!-- The only icon here used for two different jobs (S-15): it labels the trainer's note on the
         plan card, and it is the whole of the control that opens an exercise's description. Both are
         "there is more to read about this", which is why one glyph serves both. -->
    @case ('info') {
      <circle cx="12" cy="12" r="9" />
      <path d="M12 11v5" />
      <circle cx="12" cy="7.75" r="0.9" fill="currentColor" stroke="none" />
    }
    @case ('more') {
      <circle cx="5" cy="12" r="1.25" fill="currentColor" stroke="none" />
      <circle cx="12" cy="12" r="1.25" fill="currentColor" stroke="none" />
      <circle cx="19" cy="12" r="1.25" fill="currentColor" stroke="none" />
    }
    @case ('time') {
      <circle cx="12" cy="13" r="7.5" />
      <path d="M12 5.5V3M9.5 3h5" />
      <path d="M12 13l3-3" />
    }
    <!-- A plain dial, deliberately unlike ('time') above: that one is a stopwatch and marks the
         duration an exercise is HELD, this one marks the rest BETWEEN sets. They sit side by side on
         the same card, so they must not read as the same glyph. -->
    @case ('clock') {
      <circle cx="12" cy="12" r="8.5" />
      <path d="M12 7v5l3.5 2" />
    }
    @case ('idea') {
      <path d="M9 17.5h6" />
      <path d="M9.5 20h5" />
      <path d="M8.5 14.5a6 6 0 1 1 7 0c-.8.6-1.5 1.3-1.5 2.5h-5c0-1.2-.7-1.9-1.5-2.5Z" />
      <path d="M12 2v2M4.9 4.9l1.4 1.4M2 12h2M19.1 4.9l-1.4 1.4M22 12h-2" />
    }
    <!-- Powtórzenia: a loop of two arrows, drawn square so it keeps its shape at any size. Serie
         have their own glyph below — one meaning, one icon, and never the same icon for two. -->
    @case ('repeat') {
      <path d="m17 2 4 4-4 4" />
      <path d="M3 11v-1a4 4 0 0 1 4-4h14" />
      <path d="m7 22-4-4 4-4" />
      <path d="M21 13v1a4 4 0 0 1-4 4H3" />
    }
    <!-- Serie: stacked layers, one per set. -->
    @case ('sets') {
      <path d="M12 3 3 7.5l9 4.5 9-4.5L12 3Z" />
      <path d="m3 12 9 4.5 9-4.5" />
      <path d="m3 16.5 9 4.5 9-4.5" />
    }
    <!-- The select's arrow (app-select). A stroked chevron from this grid rather than a '▼' glyph,
         so it matches every other icon's weight instead of the font's. -->
    @case ('chevron-down') {
      <path d="m6 9 6 6 6-6" />
    }
    <!-- The plan builder's reorder handle: six dots, the platform shape for "drag me". -->
    @case ('drag') {
      <circle cx="9" cy="6" r="1.25" fill="currentColor" stroke="none" />
      <circle cx="15" cy="6" r="1.25" fill="currentColor" stroke="none" />
      <circle cx="9" cy="12" r="1.25" fill="currentColor" stroke="none" />
      <circle cx="15" cy="12" r="1.25" fill="currentColor" stroke="none" />
      <circle cx="9" cy="18" r="1.25" fill="currentColor" stroke="none" />
      <circle cx="15" cy="18" r="1.25" fill="currentColor" stroke="none" />
    }

    @case ('hantle') {
      <path d="M6 7v10M3.5 9.5v5M8.5 9v6" />
      <path d="M18 7v10M20.5 9.5v5M15.5 9v6" />
      <path d="M8.5 12h7" />
    }
    <!-- Członkowie (S-25): two heads and shoulders — a list of PEOPLE, unlike the bar's other list
         tabs, which are lists of classes and exercises. -->
    @case ('members') {
      <circle cx="9" cy="8" r="3.25" />
      <path d="M3 20c0-3.6 2.7-6 6-6s6 2.4 6 6" />
      <circle cx="17" cy="9" r="2.5" />
      <path d="M16.5 14.1c2.6.3 4.5 2.4 4.5 5.4" />
    }
    <!-- The phone app bar's up/back control (mobile-native-feel): an arrow rather than a bare
         chevron, the Material shape for "back", which a chevron in this set would read as "previous". -->
    @case ('back') {
      <path d="M19 12H5" />
      <path d="m11 6-6 6 6 6" />
    }
    <!-- One head and shoulders, unframed: who instructs a class, beside their name. -->
    @case ('person') {
      <circle cx="12" cy="8" r="3.5" />
      <path d="M5 20c0-3.9 3.1-6.5 7-6.5s7 2.6 7 6.5" />
    }
    <!-- The account (the phone bar's Moje konto). No ring of its own: the bar draws a filled disc
         behind it, which is what tells it apart from ('person') above. -->
    @case ('profile') {
      <circle cx="12" cy="8.5" r="3.25" />
      <path d="M6 19.5c.7-3.2 3-5.2 6-5.2s5.3 2 6 5.2" />
    }
    <!-- The karnet: a ticket with notched sides and a perforation. -->
    @case ('ticket') {
      <path
        d="M3 9a3 3 0 0 0 0 6v2a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2Z"
      />
      <path d="M14 5v2M14 11v2M14 17v2" />
    }
    <!-- The four attendance states (S-27). Bare glyphs rather than circled ones: they sit inside a
         chip or a toggle that already draws the container, and a second ring reads as noise. -->
    @case ('present') {
      <path d="M5 12.5l4.5 4.5L19 7.5" />
    }
    @case ('absent') {
      <path d="M6.5 6.5l11 11M17.5 6.5l-11 11" />
    }
    @case ('unrecorded') {
      <path d="M7 12h10" />
    }
    @case ('cancelled') {
      <circle cx="12" cy="12" r="8" />
      <path d="M6.5 17.5l11-11" />
    }
  }
</svg>
