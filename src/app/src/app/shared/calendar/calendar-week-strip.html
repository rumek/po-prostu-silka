<!-- Nine identical cells. The arrows are not a different kind of control from the days — they all
     move the same view — so they are not a different kind of button either. -->
<div class="strip" role="group" aria-label="Dni tygodnia">
  <button type="button" class="strip-button" (click)="stepWeeks(-1)" aria-label="Poprzedni tydzień">
    &laquo;
  </button>

  @for (day of days(); track day.date.getTime()) {
    <button
      type="button"
      class="strip-button"
      [class.is-selected]="day.isSelected"
      [class.is-today]="day.isToday"
      [attr.aria-current]="day.isSelected ? 'date' : null"
      [attr.aria-label]="day.date | date: 'EEEE, d MMMM y'"
      (click)="select(day.date)"
    >
      {{ day.label }}
    </button>
  }

  <button type="button" class="strip-button" (click)="stepWeeks(1)" aria-label="Następny tydzień">
    &raquo;
  </button>
</div>
