<!-- Labelled, unlike the header's <nav>: with two navigation landmarks in the document, an unlabelled
     pair is indistinguishable to a screen reader listing them. -->
<nav class="bottom-nav" aria-label="Nawigacja główna">
  <ul class="bottom-nav-list">
    @for (tab of tabs; track tab.route) {
      <li>
        <!-- aria-label carries the name, because the icon is aria-hidden and there is no text: without
             it a screen reader announces five empty links. title gives the same name on a long press
             and on the rare pointer that reaches this bar. -->
        <a
          class="bottom-nav-tab"
          [routerLink]="tab.route"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: tab.exact }"
          #active="routerLinkActive"
          [attr.aria-current]="active.isActive ? 'page' : null"
          [attr.aria-label]="tab.label"
          [title]="tab.label"
        >
          <app-icon [name]="tab.icon" />
        </a>
      </li>
    }
  </ul>
</nav>
