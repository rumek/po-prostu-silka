<!-- Labelled, unlike the header's <nav>: with two navigation landmarks in the document, an unlabelled
     pair is indistinguishable to a screen reader listing them. -->
<nav class="bottom-nav" aria-label="Nawigacja główna">
  <ul class="bottom-nav-list">
    @for (tab of links(); track tab.route) {
      <li>
        <!-- The label is printed beside the icon, so aria-label no longer carries the name alone -
             it must simply AGREE with the visible text, or a voice-control user asking for the tab by
             the word they can see is refused (WCAG 2.5.3). Both read tab.label, so they cannot drift.
             title gives the same name on a long press and on the rare pointer that reaches this bar. -->
        <!-- A real href rather than routerLink (mobile-native-feel): a tap has to choose between a
             push, a replace and a pop, which routerLink cannot. Middle-click and long press still
             see the href. -->
        <a
          class="bottom-nav-tab"
          [attr.href]="tab.route"
          (click)="go($event, tab)"
          [class.is-active]="isActive(tab)"
          [attr.aria-current]="isActive(tab) ? 'page' : null"
          [attr.aria-label]="tab.label"
          [title]="tab.label"
        >
          <app-icon [name]="tab.icon" />
          <span class="bottom-nav-tab-label"
            ><span>{{ tab.label }}</span></span
          >
        </a>
      </li>
    }
  </ul>
</nav>
