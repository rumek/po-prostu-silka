<a class="skip-link" href="#main">Przejdź do treści</a>

<header class="shell-header" [class.is-titled]="titled()" [class.is-home]="home()">
  <img src="logo.png" alt="Po Prostu Siłka Logo" class="shell-brand" routerLink="/" />

  <!-- The phone's app bar (mobile-native-feel): the screen's name, and on a child screen the way up.
       Rendered only for a signed-in, non-brand screen, and shown only at 30rem and below — on a
       desktop the screen's own <h1 class="screen-title"> is the heading and this stays hidden, so
       exactly one h1 is displayed at any width. -->
  @if (titled()) {
    <div class="shell-bar">
      @if (screen.level() === 'child') {
        <button type="button" class="shell-back" aria-label="Wróć" (click)="up()">
          <app-icon name="back" />
        </button>
      }
      <h1 class="shell-title">{{ screen.title() }}</h1>
    </div>
  }

  @if (auth.isAuthenticated()) {
    <nav class="shell-nav">
      <!-- The persona's links (S-25), from the one table in core/layout/navigation.ts that the bottom
           bar and /more also read. Each link's persona is its route guard's, by construction, so no
           condition here can disagree with a guard (the S-01 F5 bug class). An account with no
           persona — a blocked one — gets an empty list and keeps only Moje konto and logout below. -->
      @for (link of nav().header; track link.route) {
        <a
          [routerLink]="link.route"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: link.exact }"
          >{{ link.label }}</a
        >
      }

      <!-- Gated on isAuthenticated() by the enclosing block alone, unlike every link above it: the
           profile screen is where a Pending member completes the contact details S-13 added, so
           narrowing this to isActive() would hide the one screen an unapproved account needs. Its
           route and its API group make the same choice. -->
      <a routerLink="/profile" routerLinkActive="is-active">Moje konto</a>

      <button type="button" class="shell-logout" (click)="logout()">Wyloguj się</button>
    </nav>

    <!-- The phone's way to the account screen, at the bar's right edge on every signed-in screen.
         Gated like Moje konto above, on isAuthenticated() alone, for the same reason. Hidden on
         /profile itself, where it would lead nowhere, and above 30rem, where the nav carries it. -->
    <a
      class="shell-profile"
      routerLink="/profile"
      routerLinkActive="is-active"
      aria-label="Moje konto"
      title="Moje konto"
    >
      <app-icon name="profile" />
    </a>
  }
</header>

<main id="main" class="shell-main">
  <!-- Above the routed view rather than inside one screen: the prompt is about the account, not
       about whatever the member happens to be looking at, and it renders nothing at all unless push
       is usable and undecided. Gated on isActive() to match every other member control here — an
       unapproved account has nothing yet to be notified about. The install offer sits beside it for
       the same reasons, and renders nothing unless the browser handed over its install prompt. -->
  @if (auth.isActive()) {
    <app-install-prompt />
    <app-push-prompt />
  }

  <router-outlet />
</main>

<!-- Mounted once, outside every route and outside every gate: a toast can be raised from the login
     screen as readily as from the admin's member list, and the outlet that shows it must not depend
     on who is signed in. Sibling of <main> rather than inside it so it is not clipped or scrolled by
     the routed view. -->
<app-toast-host />

<!-- The phone's navigation. Inside the same isAuthenticated() gate the header's nav uses, and for the
     same reason: the shell renders before any guard runs, so until sessionResolved flips every role
     signal reads false. The bar itself stays role-blind — it renders the links the shell hands it. -->
@if (auth.isAuthenticated()) {
  <app-bottom-nav [links]="nav().bar" />
}
