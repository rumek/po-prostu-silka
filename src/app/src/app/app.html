<a class="skip-link" href="#main">Przejdź do treści</a>

<header class="shell-header">
  <img src="logo.png" alt="Po Prostu Siłka Logo" class="shell-brand" routerLink="/" />

  @if (auth.isAuthenticated()) {
    <nav class="shell-nav">
      <!-- The member's two screens, and the first nav entries this app has ever had for them. Until
           S-08 /schedule had no link anywhere: it was reachable only by typing the URL, and Home said
           the schedule would appear "wkrótce".

           Gated on isActive() alone rather than on a role — every account reads the schedule and its
           own classes, the admin included, and the API applies ActiveMember at both endpoint groups.
           A blocked member sees neither, which matches what those routes would do to them anyway.

           Admin-only links are hidden rather than disabled, and their condition MUST match
           adminGuard's (isAdmin && isActive) and the backend Admin policy (Active + Admin role): on
           isAdmin() alone an unusable admin account would see a link that bounces them straight back
           to /, which is the exact confusion hiding it prevents. -->
      @if (auth.isActive()) {
        <a routerLink="/schedule" routerLinkActive="is-active">Grafik</a>
        <a routerLink="/my-classes" routerLinkActive="is-active">Zajęcia</a>
        <!-- Gated on isActive() alone like its neighbours: every approved account has a plan
             surface, whether or not one has been assigned yet. The screen says so itself when
             there is no plan, which is a better answer than a missing link. -->
        <a routerLink="/my-plan" routerLinkActive="is-active">Plan</a>
      }

      <!-- The trainer's member list (S-22, UX-08), which replaced "Plany": a plan is reached
           through its member. Trainer WITHOUT Admin — STRICTER than trainerGuard, never weaker, so
           it cannot produce the bounce the admin-link comment above warns about. Admins are left
           out because they already have a member list (/admin/members) and one role gets one path
           to one list. -->
      @if (auth.isTrainer() && !auth.isAdmin() && auth.isActive()) {
        <a routerLink="/trainer/members" routerLinkActive="is-active">Członkowie</a>
      }

      <!-- Gated on isAuthenticated() by the enclosing block alone, unlike every link above it: the
           profile screen is where a Pending member completes the contact details S-13 added, so
           narrowing this to isActive() would hide the one screen an unapproved account needs. Its
           route and its API group make the same choice. -->
      <a routerLink="/profile" routerLinkActive="is-active">Moje konto</a>

      <button type="button" class="shell-logout" (click)="logout()">Wyloguj się</button>
    </nav>
  }
</header>

<main id="main" class="shell-main">
  <!-- Above the routed view rather than inside one screen: the prompt is about the account, not
       about whatever the member happens to be looking at, and it renders nothing at all unless push
       is usable and undecided. Gated on isActive() to match every other member control here — an
       unapproved account has nothing yet to be notified about. -->
  @if (auth.isActive()) {
    <app-push-prompt />
  }

  <router-outlet />
</main>

<!-- Mounted once, outside every route and outside every gate: a toast can be raised from the login
     screen as readily as from the admin's member list, and the outlet that shows it must not depend
     on who is signed in. Sibling of <main> rather than inside it so it is not clipped or scrolled by
     the routed view. -->
<app-toast-host />

<!-- The phone's navigation. Inside the same isAuthenticated() gate the header's nav uses, and for the
     same reason: the shell renders before any guard runs, so until sessionResolved flips every role
     signal reads false. The bar itself is role-blind — see BottomNav. -->
@if (auth.isAuthenticated()) {
  <app-bottom-nav />
}
