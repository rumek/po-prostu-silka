<a class="skip-link" href="#main">Przejdź do treści</a>

<header class="shell-header">
  <a class="shell-brand" routerLink="/">Po Prostu Siłka</a>

  @if (auth.isAuthenticated()) {
    <nav class="shell-nav">
      <!-- Admin-only, and hidden rather than disabled: a member who never sees the link never
           wonders why it refuses them. The API enforces it regardless — MemberAdminEndpoints
           applies the Admin policy at the group.

           The condition MUST match adminGuard's (isAdmin && isActive) and the backend Admin policy
           (Active + Admin role). On isAdmin() alone, an unapproved admin would see the link and get
           bounced /admin/approvals -> / -> /pending, which is the exact confusion this comment
           claims to prevent. -->
      @if (auth.isAdmin() && auth.isActive()) {
        <a routerLink="/admin/approvals" routerLinkActive="is-active">Zgłoszenia</a>
      }

      <button type="button" class="shell-logout" (click)="logout()">Wyloguj się</button>
    </nav>
  }
</header>

<main id="main" class="shell-main">
  <router-outlet />
</main>
