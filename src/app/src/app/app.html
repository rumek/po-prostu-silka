<a class="skip-link" href="#main">Przejdź do treści</a>

<header class="shell-header">
  <a class="shell-brand" routerLink="/">Po Prostu Siłka</a>

  @if (auth.isAuthenticated()) {
    <nav class="shell-nav">
      <!-- Admin-only, and hidden rather than disabled: a member who never sees the link never
           wonders why it refuses them. The API enforces it regardless — MemberAdminEndpoints
           applies the Admin policy at the group.

           The condition MUST match adminGuard's (isAdmin && isActive) and the backend Admin policy
           (Active + Admin role). On isAdmin() alone, an unapproved admin would see the link and get
           bounced /admin/approvals -> / -> /pending, which is the exact confusion this comment
           claims to prevent. -->
      <!-- The member's two screens, and the first nav entries this app has ever had for them. Until
           S-08 /schedule had no link anywhere: it was reachable only by typing the URL, and Home said
           the schedule would appear "wkrótce".

           Gated on isActive() alone rather than on a role — every approved account books as a member,
           the admin included, and the API applies ActiveMember at both endpoint groups. A Pending
           member sees neither, which matches what those routes would do to them anyway. -->
      @if (auth.isActive()) {
        <a routerLink="/schedule" routerLinkActive="is-active">Grafik</a>
        <a routerLink="/my-classes" routerLinkActive="is-active">Moje zajęcia</a>
      }

      @if (auth.isAdmin() && auth.isActive()) {
        <a routerLink="/admin/approvals" routerLinkActive="is-active">Zgłoszenia</a>
      }

      <button type="button" class="shell-logout" (click)="logout()">Wyloguj się</button>
    </nav>
  }
</header>

<main id="main" class="shell-main">
  <!-- Above the routed view rather than inside one screen: the prompt is about the account, not
       about whatever the member happens to be looking at, and it renders nothing at all unless push
       is usable and undecided. Gated on isActive() to match every other member control here — an
       unapproved account has nothing yet to be notified about. -->
  @if (auth.isActive()) {
    <app-push-prompt />
  }

  <router-outlet />
</main>
