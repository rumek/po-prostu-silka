<h1>Grafik zajęć</h1>
@if (persona() === 'trainer') {
  <!-- The server narrows a trainer to their own classes (S-25); the screen says so, so an empty week
       is not read as "the club has nothing on". -->
  <p class="hint">Grafik pokazuje tylko zajęcia, które prowadzisz.</p>
}
<p class="hint">Wybierz zajęcia, aby zobaczyć listę zapisanych i zapisać członka.</p>

<!-- Loading, failure and the empty state all live inside the calendar: it keeps the grid mounted
     through all three, so navigating between weeks never makes the page jump.

     `selectable`, not `readOnly`: no drag, no resize, no draw — those are the desk calendar's. A
     selected class opens its roster. -->
<app-schedule-calendar
  [classes]="rows()"
  [loading]="loading()"
  [loadFailed]="loadFailed()"
  [selectable]="true"
  (rangeChange)="load($event)"
  (classSelected)="openBookings($event)"
/>

@if (loadFailed()) {
  <!-- The calendar states the failure; the recovery belongs to the screen that owns the fetch. Same
       shape as the admin panel's, so a dropped connection reads the same on both. -->
  <p class="alert" role="alert">
    @if (loadMessage(); as detail) {
      {{ detail }}
    }
    <button type="button" class="link-button" (click)="reload()">Spróbuj ponownie</button>
  </p>
}

@if (selected(); as row) {
  <app-class-bookings-overlay
    [row]="row"
    [search]="candidateSearch()"
    (released)="afterRelease(row)"
    (booked)="afterBooking($event)"
    (closed)="closeBookings()"
  />
}
